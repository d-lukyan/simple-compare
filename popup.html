<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Compare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Simple Compare</h2>
  <div class="main-container">
    <div id="inputs">
      <input type="text" id="input-1" class="input" placeholder="String 1"
             spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="String 1">
      <input type="text" id="input-2" class="input" placeholder="String 2"
             spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="String 2">
      <div id="btn-clear-container">
        <button type="button" id="clear">Clear All 🗑️</button>
      </div>
      <div id="result-length"></div>
      <div id="result-character"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
